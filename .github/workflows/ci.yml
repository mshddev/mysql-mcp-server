name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: unit tests
        run: go test ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["mariadb:10.11", "mysql:8.4"]
    env:
      MYSQL_DEV_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The same compose.yaml contributors use locally; the seed is applied
      # on first start and --wait blocks on the healthcheck until it has run.
      - name: start seeded database
        run: docker compose up -d --wait

      - name: integration tests
        run: MYSQL_TEST_ADDR=127.0.0.1:3306 go test -count=1 ./...

      - name: database logs
        if: failure()
        run: docker compose logs db
