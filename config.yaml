# Structure and limits live here; the two secrets come from the environment.
# Local dev points at the DBngin MariaDB seeded via seed/seed.sql.
# For staging, change host/port/database (or keep a separate config file
# and start the server with --config).
server:
  listen: ":3000"
  auth_token: ${MCP_AUTH_TOKEN}

database:
  host: 127.0.0.1
  port: 3306
  user: mcp_readonly
  password: ${MYSQL_PASSWORD}
  database: mcp_dev

limits:
  max_rows: 200
  timeout_seconds: 30
  max_response_bytes: 1048576
  max_connections: 10
