# Copy to config.yaml (gitignored) and adjust per environment.
# ${VAR} placeholders are filled from the environment. They work in every
# text setting the server reads that way — listen, auth_token, host,
# username, password, dbname, the tls paths and logging.file — not just the
# two secrets below. An unset variable is a startup error naming it, never a silent
# empty string.
# These defaults point at a local dev database seeded via seed/seed.sql.

# What the server itself lets through:
#   read_only   (default) — every connection runs SET SESSION TRANSACTION
#               READ ONLY, so even an over-privileged user can't write
#               through this server. Use this for production.
#   full_access — that guard is dropped; the MySQL user's grants are the only
#               boundary, and writes report affected_rows / last_insert_id.
#               For disposable environments (staging) with a scoped user.
mode: read_only

# The whole server section is ignored under --stdio (the client that launched
# the process is the only caller), placeholders included, so this file loads
# there without MYSQL_MCP_AUTH_TOKEN set.
server:
  # Loopback on purpose: a TLS-terminating reverse proxy on the same host
  # fronts it (README, Deploy). ":3000" binds every interface; do that only on
  # a private network you trust, since the token then travels in the clear.
  listen: "127.0.0.1:3000"
  auth_token: ${MYSQL_MCP_AUTH_TOKEN}

database:
  host: 127.0.0.1
  port: 3306
  username: mcp_readonly
  password: ${MYSQL_PASSWORD}
  dbname: mcp_dev
  # Encrypt this hop. Off when the section is absent, which is right for a
  # database on the same host or private network. Turn it on for a managed
  # database (RDS, Cloud SQL, PlanetScale) or one reached across a network
  # you don't control. The database has to offer TLS: there is no fallback to
  # plaintext, so a database without it is a refused connection at startup.
  # With it on, the certificate is verified unless you say otherwise.
  # tls:
  #   enabled: true
  #   ca: /etc/mysql-mcp-server/db-ca.pem   # the CA that signed the database's
  #                                          # certificate; omit for a public CA
  #   server_name: db.internal              # the name on the certificate, when
  #                                          # host above is an IP or an alias
  #   cert: /etc/mysql-mcp-server/client.pem  # mutual TLS, for a user granted
  #   key: /etc/mysql-mcp-server/client-key.pem  # with REQUIRE X509; both or neither
  #   insecure_skip_verify: true            # encrypt but don't check who answers.
  #                                          # The only option for the certificate
  #                                          # MySQL/MariaDB generate for themselves
  #                                          # (no SAN, so unverifiable); warns at
  #                                          # startup. Excludes ca and server_name.

# Guardrails on a single call. All three must be at least 1.
limits:
  # A query still running at this point is killed on the server, not just
  # abandoned by the client.
  timeout_seconds: 30
  # Caps the JSON sent back — rows stop streaming once it is reached and the
  # response says so. It does NOT cap what MySQL reads: a wide blob column
  # still crosses the wire in full (it counts as a short placeholder here), so
  # timeout_seconds is the only backstop against a huge underlying read.
  max_response_bytes: 512000
  # Size of the connection pool, and so the ceiling on concurrent queries.
  max_connections: 10

# Logging: one JSON line per event, to stdout by default (stderr under
# --stdio, where stdout carries the protocol). Switch output to "file" to
# write to a self-rotating log file instead. Remember the log
# records every query verbatim — on disk that history outlives the session,
# so protect the file like the data it describes.
logging:
  output: stdout            # stdout | file
  level: info               # debug | info | warn | error
  # file: /var/log/mysql-mcp-server/server.log   # required with output: file
  # rotation:               # only used with output: file
  #   max_size_mb: 100      # rotate once the file reaches this size
  #   max_backups: 5        # rotated files to keep (0 = keep all)
  #   max_age_days: 30      # days to keep rotated files (0 = forever)
  #   compress: false       # gzip rotated files

# PII masking: values of matching columns are returned as "<masked>".
# Entries are case-insensitive globs matched against a column's real (origin)
# name — aliases can't dodge them. A bare entry ("phone") matches that column
# name in every table; a qualified one ("users.address") matches only there.
# "except" carves false positives back out and beats "mask". Omit the whole
# section to run without masking; set enabled: false to keep the rules but
# switch masking off.
#
# Masking is enforced: the server reads each query and traces every result
# column to its source, so renames, derived tables, CTEs, UNIONs, and computed
# columns (CONCAT, GROUP_CONCAT, ...) stay masked, and a query it can't verify
# (e.g. a SELECT * inside a sub-query) is refused with an error the agent can
# act on. Columns exposed through views are the known gap — add the view's own
# column names to the rules.
#
# How strictly this is enforced follows `mode` above — there is no separate
# setting. Under read_only it is enforced everywhere. Under full_access it
# degrades to a best-effort seatbelt: a write can copy PII into tables the
# rules don't name, and writes, DDL, and statements the parser can't read run
# with wire-metadata masking only (reads it can parse stay strictly checked).
# The server logs a warning at startup whenever it runs in that combination.
#
# "values" adds a second layer that works by shape instead of by name: every
# text cell the column rules left alone is scanned, and a span that looks like
# an email address (email) or an Indonesian mobile number (phone_id: 08…, 62…,
# +62…) comes back as "<masked>" with the rest of the cell intact. It catches
# personal data in columns no rule can name — free text, JSON blobs, a view's
# renamed column, a table copied under full_access — and only ever masks more.
# It is best-effort: a name or an address has no shape, so keep the column
# rules as the primary mechanism. "except" shields a column from both layers,
# which is also the fix when a business value (an invoice number) looks like a
# phone. Omit "values" to run without it.
masking:
  enabled: true
  mask:
    - phone
    - "*_phone"
    - phone_number
    - email
    - "*_email"
    - name          # exact on purpose, NOT "*_name": room_name etc. are business data
    - address
    - "*_address"
    - nik
    - ktp
    - "*_ktp*"
    - npwp
    - birth_date
    - birthday
    - password
    - "*_token"
    - "*account_number*"
  except: []
  values: [email, phone_id]
