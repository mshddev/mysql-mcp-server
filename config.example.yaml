# Copy to config.yaml (gitignored) and adjust per environment.
# The two secrets come from the environment via ${VAR} placeholders.
# These defaults point at a local dev database seeded via seed/seed.sql.

# What the server itself lets through:
#   read_only   (default) — every connection runs SET SESSION TRANSACTION
#               READ ONLY, so even an over-privileged user can't write
#               through this server. Use this for production.
#   full_access — that guard is dropped; the MySQL user's grants are the only
#               boundary, and writes report affected_rows / last_insert_id.
#               For disposable environments (staging) with a scoped user.
mode: read_only

server:
  # Loopback by default; use ":3000" to expose on all interfaces (e.g. team VM).
  listen: "127.0.0.1:3000"
  auth_token: ${MCP_AUTH_TOKEN}

database:
  host: 127.0.0.1
  port: 3306
  username: mcp_readonly
  password: ${MYSQL_PASSWORD}
  dbname: mcp_dev

limits:
  timeout_seconds: 30
  max_response_bytes: 512000
  max_connections: 10

# Logging: one JSON line per event, to stdout by default. Switch output to
# "file" to write to a self-rotating log file instead. Remember the log
# records every query verbatim — on disk that history outlives the session,
# so protect the file like the data it describes.
logging:
  output: stdout            # stdout | file
  level: info               # debug | info | warn | error
  # file: /var/log/mysql-mcp-server/server.log   # required with output: file
  # rotation:               # only used with output: file
  #   max_size_mb: 100      # rotate once the file reaches this size
  #   max_backups: 5        # rotated files to keep (0 = keep all)
  #   max_age_days: 30      # days to keep rotated files (0 = forever)
  #   compress: false       # gzip rotated files

# PII masking: values of matching columns are returned as "<masked>".
# Entries are case-insensitive globs matched against a column's real (origin)
# name — aliases can't dodge them. A bare entry ("phone") matches that column
# name in every table; a qualified one ("users.address") matches only there.
# "except" carves false positives back out and beats "mask". Omit the whole
# section to run without masking; set enabled: false to keep the rules but
# switch masking off.
#
# Masking is enforced: the server reads each query and traces every result
# column to its source, so renames, derived tables, CTEs, UNIONs, and computed
# columns (CONCAT, GROUP_CONCAT, ...) stay masked, and a query it can't verify
# (e.g. a SELECT * inside a sub-query) is refused with an error the agent can
# act on. Columns exposed through views are the known gap — add the view's own
# column names to the rules.
#
# How strictly this is enforced follows `mode` above — there is no separate
# setting. Under read_only it is enforced everywhere. Under full_access it
# degrades to a best-effort seatbelt: a write can copy PII into tables the
# rules don't name, and writes, DDL, and statements the parser can't read run
# with wire-metadata masking only (reads it can parse stay strictly checked).
# The server logs a warning at startup whenever it runs in that combination.
masking:
  enabled: true
  mask:
    - phone
    - "*_phone"
    - phone_number
    - email
    - "*_email"
    - name          # exact on purpose, NOT "*_name": room_name etc. are business data
    - address
    - "*_address"
    - nik
    - ktp
    - "*_ktp*"
    - npwp
    - birth_date
    - birthday
    - password
    - "*_token"
    - "*account_number*"
  except: []
